[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linklens-analysis"
version = "0.0.0"
description = "Statistical analysis for LinkLens evaluation experiments (E1–E8)"
requires-python = ">=3.11"
dependencies = [
  "cycler>=0.12",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# L13 ML prioritiser (analysis/ml): LightGBM lambdarank and its built-in TreeSHAP.
ml = ["lightgbm>=4.3"]

[tool.setuptools.packages.find]
include = ["linklens_analysis*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
