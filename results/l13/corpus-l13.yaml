# L13 training corpus: 9 sites of packages/eval/corpus.yaml (3 per class), audited for E6
# labels and fix features. Same seed, policy, sigma and config as the main corpus.
#
# Every site is audited with the same config and seed (below), one after another, by
#   pnpm --filter @linklens/eval corpus run --batch <name>
# The crawler obeys robots.txt (RFC 9309) and the per-host throttle, so a site that disallows
# LinkLensBot is recorded as blocked, not crawled. Check each site's terms before a batch, and
# replace a site here (not in a running batch: resuming refuses a changed site list).
#
# Scope is the seed's host (config.includeSubdomains is off), so a seed path is only where the
# breadth-first crawl starts: the other pages of the host are in scope too (see the notes).
#
# E5: the 10 sites with `screaming_frog: true` are also crawled with Screaming Frog (start at the
# same URL; export Internal: All, Bulk Export → Links → All Inlinks, and Reports → Orphan Pages)
# and imported with `corpus import-sf`.

version: 1

# config.randomSeed for every run (fixed: determinism principle).
seed: 42

# The audit: canonicalisation policy, σ variant and REF variant. The export still derives
# metrics under all six policies; fixes exist only where a ranking was computed.
policy: P3
sigma: refGateCosine
refVariant: weighted

# Also rank fixes under the other five policies after each audit (the API's per-policy ranking
# job), so E1 can compare the top-k fix lists of every pair of policies.
rankAllPolicies: false

# Overrides of packages/core/src/config.ts, applied to every site (empty = the defaults, e.g.
# pageCap 500, crawlDelayMs 500). The User-Agent comes from config or LINKLENS_USER_AGENT and
# is recorded in the batch manifest.
config: {}

classes:
  cms-blog:
    label: CMS blog
    description: >-
      Chronological posts generated by a blog engine or CMS: date/category/tag archives, paginated
      indexes, site-wide navigation and sidebars.
  ecommerce-catalogue:
    label: E-commerce / catalogue
    description: >-
      Product catalogues: category trees, faceted or paginated listings, product detail pages,
      cart/account utility pages.
  documentation:
    label: Documentation
    description: >-
      Technical documentation from static-site generators: a sidebar table of contents,
      prev/next links, versioned or translated copies.

sites:
  - id: css-tricks
    url: https://css-tricks.com/
    architecture_class: cms-blog
    notes: WordPress. Large archive with tags, categories and an almanac section.
    screaming_frog: true
  - id: simon-willison
    url: https://simonwillison.net/
    architecture_class: cms-blog
    notes: Custom Django blog; dense tag archives, blogmarks and quotations.
    screaming_frog: true
  - id: julia-evans
    url: https://jvns.ca/
    architecture_class: cms-blog
    notes: Static blog (Hugo); a single long archive page.
    screaming_frog: true
  - id: books-toscrape
    url: https://books.toscrape.com/
    architecture_class: ecommerce-catalogue
    notes: Scraping sandbox; static catalogue with category tree and paginated listings.
    screaming_frog: true
  - id: scrapeme-live
    url: https://scrapeme.live/shop/
    architecture_class: ecommerce-catalogue
    notes: WooCommerce demo shop for scraping practice; paginated product grid.
    screaming_frog: true
  - id: webscraper-test
    url: https://webscraper.io/test-sites/e-commerce/static
    architecture_class: ecommerce-catalogue
    notes: Static e-commerce test site; the host also serves webscraper.io's own pages (in scope).
    screaming_frog: true
  - id: vite
    url: https://vite.dev/
    architecture_class: documentation
    notes: VitePress. Guide, config and API sections with a sidebar.
    screaming_frog: true
  - id: pytest
    url: https://docs.pytest.org/en/stable/
    architecture_class: documentation
    notes: Sphinx on Read the Docs; version paths (/en/stable, /en/latest) share the host.
    screaming_frog: true
  - id: flask
    url: https://flask.palletsprojects.com/en/stable/
    architecture_class: documentation
    notes: Sphinx; versioned paths. Classic toctree navigation.
