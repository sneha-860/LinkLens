# The evaluation corpus: 28 public sites in three architecture classes.
#
# Every site is audited with the same config and seed (below), one after another, by
#   pnpm --filter @linklens/eval corpus run --batch <name>
# The crawler obeys robots.txt (RFC 9309) and the per-host throttle, so a site that disallows
# LinkLensBot is recorded as blocked, not crawled. Check each site's terms before a batch, and
# replace a site here (not in a running batch: resuming refuses a changed site list).
#
# Scope is the seed's host (config.includeSubdomains is off), so a seed path is only where the
# breadth-first crawl starts: the other pages of the host are in scope too (see the notes).
#
# E5: the 10 sites with `screaming_frog: true` are also crawled with Screaming Frog (start at the
# same URL; export Internal: All, Bulk Export → Links → All Inlinks, and Reports → Orphan Pages)
# and imported with `corpus import-sf`.

version: 1

# config.randomSeed for every run (fixed: determinism principle).
seed: 42

# The audit: canonicalisation policy, σ variant and REF variant. The export still derives
# metrics under all six policies; fixes exist only where a ranking was computed.
policy: P3
sigma: refGateCosine
refVariant: weighted

# Also rank fixes under the other five policies after each audit (the API's per-policy ranking
# job), so E1 can compare the top-k fix lists of every pair of policies.
rankAllPolicies: true

# Overrides of packages/core/src/config.ts, applied to every site (empty = the defaults, e.g.
# pageCap 500, crawlDelayMs 500). The User-Agent comes from config or LINKLENS_USER_AGENT and
# is recorded in the batch manifest.
config: {}

classes:
  cms-blog:
    label: CMS blog
    description: >-
      Chronological posts generated by a blog engine or CMS: date/category/tag archives, paginated
      indexes, site-wide navigation and sidebars.
  ecommerce-catalogue:
    label: E-commerce / catalogue
    description: >-
      Product catalogues: category trees, faceted or paginated listings, product detail pages,
      cart/account utility pages.
  documentation:
    label: Documentation
    description: >-
      Technical documentation from static-site generators: a sidebar table of contents,
      prev/next links, versioned or translated copies.

sites:
  # ── CMS blogs ────────────────────────────────────────────────────────────────────────────────
  - id: css-tricks
    url: https://css-tricks.com/
    architecture_class: cms-blog
    notes: WordPress. Large archive with tags, categories and an almanac section.
    screaming_frog: true
  - id: joel-on-software
    url: https://www.joelonsoftware.com/
    architecture_class: cms-blog
    notes: WordPress. Long-running personal blog; date archives and categories.
    screaming_frog: true
  - id: coding-horror
    url: https://blog.codinghorror.com/
    architecture_class: cms-blog
    notes: Ghost. Paginated index and tag pages.
  - id: daring-fireball
    url: https://daringfireball.net/
    architecture_class: cms-blog
    notes: Movable Type-era static archive; linked-list posts point off-site.
  - id: simon-willison
    url: https://simonwillison.net/
    architecture_class: cms-blog
    notes: Custom Django blog; dense tag archives, blogmarks and quotations.
    screaming_frog: true
  - id: julia-evans
    url: https://jvns.ca/
    architecture_class: cms-blog
    notes: Static blog (Hugo); a single long archive page.
    screaming_frog: true
  - id: matt-mullenweg
    url: https://ma.tt/
    architecture_class: cms-blog
    notes: WordPress. Personal blog of the WordPress co-founder; date archives.
  - id: seths-blog
    url: https://seths.blog/
    architecture_class: cms-blog
    notes: Daily short posts; very large archive, so the page cap binds. Engine to verify.
  - id: kottke
    url: https://kottke.org/
    architecture_class: cms-blog
    notes: Long-running link blog with tag archives. Engine to verify.
  - id: pragmatic-engineer
    url: https://blog.pragmaticengineer.com/
    architecture_class: cms-blog
    notes: Ghost. Newsletter-style blog; tag pages.

  # ── E-commerce / catalogue ───────────────────────────────────────────────────────────────────
  - id: books-toscrape
    url: https://books.toscrape.com/
    architecture_class: ecommerce-catalogue
    notes: Scraping sandbox; static catalogue with category tree and paginated listings.
    screaming_frog: true
  - id: scrapeme-live
    url: https://scrapeme.live/shop/
    architecture_class: ecommerce-catalogue
    notes: WooCommerce demo shop for scraping practice; paginated product grid.
    screaming_frog: true
  - id: scrapingcourse
    url: https://www.scrapingcourse.com/ecommerce/
    architecture_class: ecommerce-catalogue
    notes: WooCommerce demo store; the host also has other practice pages (in scope).
  - id: webscraper-test
    url: https://webscraper.io/test-sites/e-commerce/static
    architecture_class: ecommerce-catalogue
    notes: Static e-commerce test site; the host also serves webscraper.io's own pages (in scope).
    screaming_frog: true
  - id: oxylabs-sandbox
    url: https://sandbox.oxylabs.io/products
    architecture_class: ecommerce-catalogue
    notes: Game catalogue sandbox with category filters and pagination. Check server rendering.
  - id: opencart-demo
    url: https://demo.opencart.com/
    architecture_class: ecommerce-catalogue
    notes: OpenCart demo store; query-string URLs (route=…), a good P2/P3 test.
  - id: lambdatest-playground
    url: https://ecommerce-playground.lambdatest.io/
    architecture_class: ecommerce-catalogue
    notes: OpenCart-based demo store with a mega menu and many query-string variants.
  - id: tutorialsninja
    url: https://tutorialsninja.com/demo/
    architecture_class: ecommerce-catalogue
    notes: OpenCart demo store; the host also has tutorial pages (in scope).
  - id: automation-exercise
    url: https://automationexercise.com/
    architecture_class: ecommerce-catalogue
    notes: Practice e-commerce site; brand and category listings.

  # ── Documentation ───────────────────────────────────────────────────────────────────────────
  - id: vite
    url: https://vite.dev/
    architecture_class: documentation
    notes: VitePress. Guide, config and API sections with a sidebar.
    screaming_frog: true
  - id: vitest
    url: https://vitest.dev/
    architecture_class: documentation
    notes: VitePress. Guide/API/config with prev/next links.
  - id: pnpm
    url: https://pnpm.io/
    architecture_class: documentation
    notes: Docusaurus. Versioned and translated copies, so the page cap binds early.
  - id: docusaurus
    url: https://docusaurus.io/
    architecture_class: documentation
    notes: Docusaurus. Docs, blog and showcase; versioned docs.
  - id: pytest
    url: https://docs.pytest.org/en/stable/
    architecture_class: documentation
    notes: Sphinx on Read the Docs; version paths (/en/stable, /en/latest) share the host.
    screaming_frog: true
  - id: flask
    url: https://flask.palletsprojects.com/en/stable/
    architecture_class: documentation
    notes: Sphinx; versioned paths. Classic toctree navigation.
  - id: mkdocs
    url: https://www.mkdocs.org/
    architecture_class: documentation
    notes: MkDocs. Small site; user guide and developer guide.
    screaming_frog: true
  - id: hugo
    url: https://gohugo.io/
    architecture_class: documentation
    notes: Hugo. Large function and method reference; many sibling pages.
  - id: expressjs
    url: https://expressjs.com/
    architecture_class: documentation
    notes: Guide and API reference, translated into several languages (URL prefixes).
